name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest on ephemeral Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 10
    env:
      DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap Supabase-managed roles and storage surface
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/ci/00_supabase_roles.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/ci/01_storage_schema.sql

      - name: Replay supabase/migrations
        run: |
          for f in supabase/migrations/*.sql; do
            echo "-- applying $f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked

      - name: ruff check
        if: ${{ !cancelled() }}
        working-directory: backend
        run: uv run ruff check

      - name: pytest
        if: ${{ !cancelled() }}
        working-directory: backend
        run: uv run pytest -q

  frontend:
    name: Frontend (lint + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: eslint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: vitest
        if: ${{ !cancelled() }}
        run: npm test -- --run

      - name: next build
        if: ${{ !cancelled() }}
        run: npm run build
