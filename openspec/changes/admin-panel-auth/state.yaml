  delivery_strategy: ask-on-risk
  chain_strategy: stacked-to-main
  review_budget_lines: 400

dag:
  proposal: complete
  specs: complete
  design: complete
  tasks: complete
  apply: pending
  verify: pending
  archive: pending

phases_completed:
  - explore
  - propose
  - spec
  - design
  - tasks

review_workload_decision:
  budget_risk: high
  estimated_changed_lines: "~700-850 (own file-by-file estimate, confirms design's own flag)"
  chained_prs: true
  suggested_split: "PR1 backend JWT + require_db_pool -> PR2 frontend session/proxy infra -> PR3 login pages + API proxy route + E2E"
  chain_strategy: stacked-to-main
  delivery_strategy: ask-on-risk
  decision_needed_before_apply: true

engram_sync_fix: >
  sdd-tasks flagged that Engram topic sdd/admin-panel-auth/spec was still stale
  (middleware.ts/login) after the orchestrator's on-disk fix following sdd-design.
  Re-upserted via mem_save (observation stays id 319) to match the corrected
  on-disk specs/admin-authentication/spec.md before proceeding to apply.

design_findings_verified_by_orchestrator:
  - >
    Confirmed against frontend/node_modules/next/dist/docs/01-app/03-api-reference/03-file-conventions/proxy.md:
    Next 16 genuinely deprecated middleware.ts/middleware() in favor of proxy.ts/proxy().
    admin-authentication spec.md was written before this was caught (parallel with design) and
    still said middleware.ts and /login -- fixed directly: now says proxy.ts and /admin/login,
    matching design.md's route-group URL contract fix (route group contributes no URL segment,
    so admin routes must live at app/(admin)/admin/** per initial-scaffolding's pinned /admin/*
    contract). proposal.md/exploration.md keep the original wording as historical record only.

product_decisions:
  scope: >
    Minimal -- auth mechanism (login, session-based route protection, JWT
    verification) plus exactly ONE read-only proof endpoint (GET /admin/products
    proxied). User chose this over Medium (+ create/list UI) to isolate
    security-critical auth work from UI/form risk. Real admin CRUD UI is an
    explicit, separate, later change.
  auth_mechanism: "Supabase Auth (email/password) via @supabase/ssr -- reuses already-running local Auth"
  call_shape: "Next.js Route Handlers as server-to-server proxy to FastAPI -- avoids CORS, keeps JWT server-side"
  jwt_verification: "FastAPI Depends on /admin router prefix, checks signature (HS256/JWT_SECRET) + exp + iss + aud, all four required"
  admin_user_provisioning: "manual one-time step (Supabase Studio/CLI), OUTSIDE this change's automated scope -- apply/verify will need this done first"
  session_expiry_ux: "redirect to login with return URL (accepted default)"
  already_authenticated_login_visit: "redirect to admin landing page (accepted default)"
  logout_control: "included in this slice, part of session lifecycle being proven (accepted default)"

known_risks:
  - "JWT library not chosen yet (PyJWT vs python-jose) -- deferred to sdd-design with rationale"
  - "db_pool is None fail-fast placement unresolved: startup abort would break the existing /health lifespan test that runs without DB_URL -- likely a per-request 503 dependency guard instead, design owns the call"
  - "review budget: Minimal scope + negative auth tests (missing/expired/wrong-iss/wrong-aud/tampered signature) is plausible but not comfortably clear of 400 lines -- sdd-tasks must forecast honestly"
  - "platform-foundation's pool-lifecycle requirement needs a genuine MODIFIED delta (fail-fast/503 clause for /admin), not just an implementation fix"

next_recommended: sdd-apply (3 chained PRs, stacked-to-main -- orchestrator to confirm split with user before launching)

notes: |
  Builds on archived products-postgres-adapter (ProductRepository/stock domain
  wired to real Postgres, zero HTTP routes yet, db_pool published on app.state
  specifically for this change to consume) and archived public-catalog-screens
  (existing @supabase/ssr dependency, two read-only anon-key client factories
  that must NOT be touched/reused for auth). Public catalog behavior must not
  change -- this change is purely additive.
