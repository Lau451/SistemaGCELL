      with the minimal correct extension: one ADMIN_API_PREFIX check,
      mirroring the file's existing CATALOG_API_PREFIX/isCatalogApiRead
      pattern -- the ONE deliberate edit to that otherwise-pinned file
      across all 4 changes that have touched this project's frontend.
      design.md/tasks.md corrected accordingly; pinned SHA256 recomputed.
