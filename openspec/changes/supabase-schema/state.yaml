change: supabase-schema
schema: spec-driven-state/v1

session_preflight:
  pace: interactive
  artifact_store: hybrid
  delivery_strategy: ask-on-risk
  chain_strategy: stacked-to-main
  review_budget_lines: 400

dag:
  proposal: complete
  specs: complete
  design: complete
  tasks: complete
  apply: complete
  verify: complete
  archive: pending

verify_result:
  verdict: pass_with_warnings
  independently_verified:
    - "supabase db reset from empty -- all 4 migrations + seed apply cleanly"
    - "rls_checks.sql re-run twice via docker exec -- 14 PASS + ALL ASSERTIONS PASSED"
    - "14 additional manual spot-checks incl. 3 real HTTP calls against local Storage API (upload/fetch/anon-write-rejected)"
    - "anon denied cost read (permission denied); anon reads catalog_products/catalog_variants with in_stock, no cost column"
    - "12 requirements / 19 scenarios across 4 spec files mapped to passing runtime evidence, read from migration SQL directly"
    - "frontend 7/7, backend 9/9 regression"
  issues:
    - severity: WARNING
      status: resolved
      description: >
        apply-progress.md claimed "18 PASS notices" from the GREEN run; script actually
        produces 14 PASS: lines + 1 summary (15 total).
      resolution: "Corrected the count in apply-progress.md (commit 069bbe5)."
    - severity: WARNING
      status: resolved
      description: >
        product_images.variant_id had an inline `references product_variants (id)` creating
        a redundant implicit simple FK alongside the documented composite FK (design
        Decision 10).
      resolution: >
        Removed the inline `references` clause from the migration SQL (variant_id is now
        a plain uuid column; the composite product_images_variant_fk already enforces
        existence + same-product membership). Documented explicitly in design.md Decision 10.
        Re-verified after supabase db reset: 15/15 rls_checks assertions pass, only the
        2 expected FKs remain on product_images, frontend 7/7, backend 9/9 (commit 069bbe5).
    - severity: SUGGESTION
      description: "588-line diff vs 400 budget -- already accepted as size:exception, no action"
    - severity: SUGGESTION
      description: "Storage bucket public-read now has real HTTP evidence, not just SQL-config checks -- good pattern to repeat"
  critical_issues: none
  evidence_hashes:
    test_output_hash: "sha256:99237960b8d2a4fcf6a357d1d4b184755161ea265c381be4d72bbf01932703f5"
    build_output_hash: "sha256:a7fd34f85d6cb7e54b5d0d52e0569835ca2e4e4408fa3f9bc81bdebe322c00a1"

apply_result:
  branch: supabase-schema (merged fast-forward into main at 266097a, branch deleted)
  tasks: "24/24 complete"
  actual_changed_lines: 588
  budget_exception: >
    588 vs 400-line budget (~47% over), driven almost entirely by the 324-line RED
    assertion script (supabase/tests/rls_checks.sql), not schema/security logic.
    User accepted as size:exception after ask-on-risk stop (declined retroactive
    2-PR split as artificial rework given interdependency between migrations and
    the verification script).
  tdd_evidence: >
    RED confirmed: rls_checks.sql run via docker exec against empty schema failed
    with "relation products does not exist". GREEN confirmed: same script after
    supabase db reset -> ALL ASSERTIONS PASSED (15/15), independently re-run by
    the orchestrator (not just trusted from agent's report).
  regression: "frontend 7/7, backend 9/9 -- independently re-run by orchestrator, unchanged app code"
  sdd_attempt_ledger: settled (state: complete, outcome: passed)
  deviations_from_design:
    - "stock_movements.id uses bigint generated always as identity (not specified in design; internal-only table)"
    - "catalog_variants.phone_model implemented as join to products.model, matching design's Data Flow column list"
  environment_note: "psql not installed on this Windows host; docker exec into supabase_db_SistemaGCELL is the working invocation for local psql access going forward"

phases_completed:
  - explore
  - propose
  - spec
  - design
  - tasks

review_workload_decision:
  budget_risk: medium
  estimated_changed_lines: "~300-420"
  chained_prs: false
  delivery_strategy: ask-on-risk
  decision_needed_before_apply: false
  note: "Under guard trigger thresholds (risk not High, chaining not recommended) -> single PR, no stop-and-ask needed"

docker_verified: "true -- Server Version 29.6.2, confirmed running on this host before tasks phase"

product_decisions:
  scope: "medium — products + variants + stock ledger; content/AI deferred"
  storage: "include now — one public-read bucket for product photos, service_role-only writes"
  domain_alignment: "SQL-only this change; Python domain code (id/color/slug, get_by_id) is an explicit fast-follow"
  stock_model: "append-only movements ledger (user override — reversed sdd-propose's original counter recommendation)"
  public_stock_visibility: "boolean in_stock only, never exact/approximate count"
  product_url_identity: "unique slug column, not raw UUID"

known_conflicts:
  - >
    Archived platform-foundation spec's "Supabase CLI Wiring Without Schema" requirement asserts
    migrations/ holds no schema SQL. This change supersedes it — sdd-spec must author a delta
    that explicitly modifies/retires that requirement, not just add new ones.

next_recommended: sdd-archive (both WARNINGs resolved and re-verified at commit 069bbe5)

notes: |
  Builds on archived initial-scaffolding (supabase init only, no schema).
  Migration naming already decided there: CLI timestamp default, carried forward.
  Docker Desktop availability on this host is unverified and becomes a hard
  dependency for supabase start/db reset local testing before this change's apply.
