change: supabase-schema
schema: spec-driven-state/v1

session_preflight:
  pace: interactive
  artifact_store: hybrid
  delivery_strategy: ask-on-risk
  chain_strategy: stacked-to-main
  review_budget_lines: 400

dag:
  proposal: complete
  specs: complete
  design: complete
  tasks: complete
  apply: pending
  verify: pending
  archive: pending

phases_completed:
  - explore
  - propose
  - spec
  - design
  - tasks

review_workload_decision:
  budget_risk: medium
  estimated_changed_lines: "~300-420"
  chained_prs: false
  delivery_strategy: ask-on-risk
  decision_needed_before_apply: false
  note: "Under guard trigger thresholds (risk not High, chaining not recommended) -> single PR, no stop-and-ask needed"

docker_verified: "true -- Server Version 29.6.2, confirmed running on this host before tasks phase"

product_decisions:
  scope: "medium — products + variants + stock ledger; content/AI deferred"
  storage: "include now — one public-read bucket for product photos, service_role-only writes"
  domain_alignment: "SQL-only this change; Python domain code (id/color/slug, get_by_id) is an explicit fast-follow"
  stock_model: "append-only movements ledger (user override — reversed sdd-propose's original counter recommendation)"
  public_stock_visibility: "boolean in_stock only, never exact/approximate count"
  product_url_identity: "unique slug column, not raw UUID"

known_conflicts:
  - >
    Archived platform-foundation spec's "Supabase CLI Wiring Without Schema" requirement asserts
    migrations/ holds no schema SQL. This change supersedes it — sdd-spec must author a delta
    that explicitly modifies/retires that requirement, not just add new ones.

next_recommended: sdd-apply (single PR, no chaining needed)

notes: |
  Builds on archived initial-scaffolding (supabase init only, no schema).
  Migration naming already decided there: CLI timestamp default, carried forward.
  Docker Desktop availability on this host is unverified and becomes a hard
  dependency for supabase start/db reset local testing before this change's apply.
