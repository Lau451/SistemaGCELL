schema: spec-driven

context: |
  Project: SistemaGCELL (brand new, no app code yet).
  Frontend: Next.js (App Router) + TypeScript + Tailwind + shadcn/ui, PWA.
  Route groups: (public) SSR/ISR catalog, (admin) auth-protected panel.
  Backend: FastAPI (Python), hexagonal/screaming by domain
    (products, stock, content, ai, recommendation, shared).
  DB/Storage: Supabase (Postgres + Storage), region São Paulo.
  AI: Google Gemini API (image + text), backend-only calls.
  Hosting: Next.js on Vercel, FastAPI on Fly.io (São Paulo).
  Testing: no runner installed yet — resolve command in first sdd-tasks.

strict_tdd: true

testing:
  status: implemented
  runner_command: "npm --prefix frontend test && uv run --project backend pytest -q"
  frameworks:
    frontend: "Vitest + @testing-library/react (jsdom)"
    backend: "pytest + pytest-asyncio + httpx (fastapi.testclient)"
  layers:
    unit: available
    integration: available
    e2e: unavailable
  coverage:
    available: false
    command: null
  quality_tools:
    linter: "eslint / ruff"
    type_checker: "next build --webpack (Next-integrated tsc; no standalone tsc script)"
    formatter: "ruff format"
  note: >
    Two independent stacks, two pinned commands — run both sequentially (or
    via runner_command) to confirm the project is green. Frontend:
    `npm --prefix frontend test` (script = `vitest run`). Backend:
    `uv run --project backend pytest -q`. Both are root-relative and
    PowerShell-safe.

rules:
  proposal:
    - Include rollback plan for risky changes
    - Call out Supabase schema/migration impact explicitly
    - Note any new Gemini API usage and where it is invoked (backend only)
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Group domain requirements per hexagonal domain (products, stock, content, ai, recommendation, shared)
  design:
    - Include sequence diagrams for complex flows (e.g. AI generation, checkout-like flows)
    - Document architecture decisions with rationale
    - Respect route groups: (public) vs (admin) in Next.js App Router
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - First change MUST pin test runner/commands for frontend and backend
    - Forecast 400-line review budget risk per _shared/sdd-phase-common.md
  apply:
    guidelines:
      - Follow hexagonal/screaming architecture boundaries on the backend
      - Keep AI (Gemini) calls backend-only, never from the Next.js client
      - Follow existing code patterns once established
    tdd: true
    test_command:
      frontend: "npm --prefix frontend test"
      backend: "uv run --project backend pytest -q"
  verify:
    test_command:
      frontend: "npm --prefix frontend test"
      backend: "uv run --project backend pytest -q"
    build_command:
      frontend: "npm --prefix frontend run build"
      backend: null
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
    - Warn before merging deltas touching Supabase schema
